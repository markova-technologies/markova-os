apiVersion: apps/v1
kind: Deployment
metadata:
  name: markova-orchestrator
  namespace: markova-production
  labels:
    app: orchestrator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5005"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: orchestrator
        image: ghcr.io/markova-technologies/orchestrator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5005
          name: http
        envFrom:
        - secretRef:
            name: orchestrator-secrets
        - configMapRef:
            name: orchestrator-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: markova-orchestrator
  namespace: markova-production
spec:
  selector:
    app: orchestrator
  ports:
  - port: 80
    targetPort: 5005
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: markova-orchestrator-hpa
  namespace: markova-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: markova-orchestrator
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: markova-orchestrator-pdb
  namespace: markova-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: orchestrator
