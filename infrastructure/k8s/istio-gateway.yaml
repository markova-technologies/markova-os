apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: markova-gateway
  namespace: markova-prod
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "api.markova.tech"
    - "admin.markova.tech"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: markova-tls-cert
    hosts:
    - "api.markova.tech"
    - "admin.markova.tech"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: markova-virtualservice
  namespace: markova-prod
spec:
  hosts:
  - "api.markova.tech"
  gateways:
  - markova-gateway
  http:
  - match:
    - uri:
        prefix: /v1
    route:
    - destination:
        host: markova-api-gateway.markova-prod.svc.cluster.local
        port:
          number: 8000
