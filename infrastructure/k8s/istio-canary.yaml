apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: markova-ai-runtime-canary
  namespace: markova-prod
spec:
  hosts:
  - ai-runtime.markova-prod.svc.cluster.local
  http:
  - name: canary-traffic-split
    route:
    - destination:
        host: ai-runtime.markova-prod.svc.cluster.local
        subset: v1-stable
      weight: 90
    - destination:
        host: ai-runtime.markova-prod.svc.cluster.local
        subset: v2-canary-llama3
      weight: 10
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: markova-ai-runtime-subsets
  namespace: markova-prod
spec:
  host: ai-runtime.markova-prod.svc.cluster.local
  subsets:
  - name: v1-stable
    labels:
      version: v1.0.0
  - name: v2-canary-llama3
    labels:
      version: v2.0.0
